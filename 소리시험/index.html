var MIME = "audio/mp4";
function put(id, msg, cls){ var e=document.getElementById(id); e.textContent=msg; e.className='out '+(cls||''); }
function bytes(){
  var bin = atob(B64), a = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return a;
}
function watch(au, id){
  au.addEventListener('playing', function(){ put(id, '재생이 시작됐습니다. 목소리가 들리나요?', 'ok'); });
  au.addEventListener('ended',   function(){ put(id, '끝까지 재생됐습니다.', 'ok'); });
  au.addEventListener('error',   function(){ put(id, '오류: ' + (au.error ? ('code ' + au.error.code) : '알 수 없음'), 'bad'); });
}
document.getElementById('b1').onclick = function(){
  put('o1','여는 중…');
  try {
    var url = URL.createObjectURL(new Blob([bytes()], {type: MIME}));
    var au = new Audio(); au.setAttribute('playsinline',''); watch(au,'o1');
    au.src = url; au.load();
    var p = au.play();
    if (p && p.catch) p.catch(function(e){ put('o1','막혔습니다: ' + e.name + ' — ' + e.message, 'bad'); });
  } catch(e){ put('o1','실패: ' + e.message, 'bad'); }
};
document.getElementById('b2').onclick = function(){
  put('o2','여는 중…');
  try {
    var au = new Audio(); au.setAttribute('playsinline',''); watch(au,'o2');
    au.src = 'data:' + MIME + ';base64,' + B64; au.load();
    var p = au.play();
    if (p && p.catch) p.catch(function(e){ put('o2','막혔습니다: ' + e.name + ' — ' + e.message, 'bad'); });
  } catch(e){ put('o2','실패: ' + e.message, 'bad'); }
};
document.getElementById('b3').onclick = function(){
  put('o3','여는 중…');
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { put('o3','이 브라우저는 웹 오디오를 못 씁니다', 'bad'); return; }
    var ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    var buf = bytes().buffer;
    var done = function(ab){
      var s = ctx.createBufferSource();
      s.buffer = ab; s.connect(ctx.destination);
      s.onended = function(){ put('o3','끝까지 재생됐습니다.', 'ok'); };
      s.start(0);
      put('o3','재생이 시작됐습니다. 목소리가 들리나요?  (상태: ' + ctx.state + ')', 'ok');
    };
    var fail = function(e){ put('o3','소리를 풀지 못했습니다: ' + (e && e.message ? e.message : e), 'bad'); };
    var r = ctx.decodeAudioData(buf, done, fail);
    if (r && r.then) r.then(done).catch(fail);
  } catch(e){ put('o3','실패: ' + e.message, 'bad'); }
};
document.getElementById('env').textContent =
  '기기 정보 — ' + navigator.userAgent;
