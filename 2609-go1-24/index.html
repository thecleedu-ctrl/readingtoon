<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#4A2A8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>리딩툰 26년9월고1 24번</title>
<style>:root{--f-kr:'Gyeonggi Batang','경기천년바탕 Regular','경기천년바탕','GyeonggiBatang','KoPubWorld Batang','Noto Serif KR','Noto Serif CJK KR','AppleMyungjo','Apple SD Gothic Neo','바탕','Batang',serif;}
:root{
  --bg:#F4F1FB; --card:#FFFFFF; --ink:#241E3F; --kr:#5C5C86;
  --purple:#4A2A8C; --purple-mid:#6B4BB8; --soft:#EDE9F9; --line:#E3DCF4;
  --tabh:58px; --shadow:0 1px 3px rgba(74,42,140,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-kr);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));}
img{max-width:100%;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}

/* ── 상단 바 ── */
.top{position:sticky;top:0;z-index:30;background:rgba(244,241,251,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;align-items:center;gap:10px;min-height:52px;}
.top .ttl{font-weight:700;font-size:15px;letter-spacing:-.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top .sub{font-size:11px;color:var(--kr);font-weight:400;}
.top .act{font-size:12.5px;font-weight:700;color:var(--purple);
  background:var(--soft);border-radius:999px;padding:7px 12px;white-space:nowrap;}
.back{font-size:19px;color:var(--purple);padding:0 2px;line-height:1;}

.wrap{max-width:560px;margin:0 auto;padding:14px 16px 24px;}
.screen{display:none;} .screen.on{display:block;}

/* ── 오늘 ── */
.hero{background:linear-gradient(135deg,#4A2A8C,#7655C8);color:#fff;border-radius:18px;
  padding:18px 18px 16px;box-shadow:var(--shadow);}
.hero h1{font-size:19px;font-weight:800;letter-spacing:-.3px;}
.hero p{font-size:12.5px;opacity:.86;margin-top:5px;line-height:1.5;}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:14px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .3s;}
.bar-n{font-size:11.5px;opacity:.9;margin-top:7px;}

.days{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;}
.days::-webkit-scrollbar{display:none;}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:9px 14px;text-align:center;min-width:64px;}
.day.on{border-color:var(--purple);background:var(--soft);}
.day b{display:block;font-size:14px;font-weight:800;color:var(--purple);}
.day s{display:block;font-size:10.5px;color:var(--kr);text-decoration:none;margin-top:2px;}

.sec-t{font-size:12px;font-weight:700;color:var(--kr);letter-spacing:.4px;margin:18px 0 9px;}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:11px;margin-bottom:9px;width:100%;text-align:left;box-shadow:var(--shadow);}
.card.done{border-color:#CBBEEC;background:#FBFAFE;}
.thumb{flex:0 0 auto;width:62px;height:62px;border-radius:12px;overflow:hidden;position:relative;
  background:var(--soft);}
.card .no{font-size:11px;font-weight:800;color:var(--purple);}
.card .tt{font-size:14.5px;font-weight:700;letter-spacing:-.2px;margin-top:1px;line-height:1.3;}
.card .mt{font-size:11px;color:var(--kr);margin-top:4px;}
.chip{display:inline-block;background:var(--soft);color:var(--purple);border-radius:99px;
  padding:2px 7px;font-size:10.5px;font-weight:700;margin-right:5px;}
.tick{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--purple);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;}

/* ── 웹툰 뷰어 ── */
.cut{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px;
  box-shadow:var(--shadow);border:1px solid var(--line);}
.art{position:relative;width:100%;aspect-ratio:1/1;background:var(--soft);overflow:hidden;}
.qimg{position:absolute;inset:0;background-repeat:no-repeat;background-size:200% 200%;}
.qimg.q0{background-position:0% 0%;}   .qimg.q1{background-position:100% 0%;}
.qimg.q2{background-position:0% 100%;} .qimg.q3{background-position:100% 100%;}
.qimg.h0,.qimg.h1{background-size:200% 100%;}
.qimg.h0{background-position:0% 50%;}  .qimg.h1{background-position:100% 50%;}
.qimg.full{background-size:cover;background-position:center;}
.cutno{position:absolute;top:9px;left:9px;z-index:3;width:24px;height:24px;border-radius:50%;
  background:rgba(74,42,140,.92);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;}
/* 마무리 컷 — 본문이 아니라 정리라서 한눈에 구별되게 */
.cutno.tag{width:auto;height:auto;border-radius:999px;padding:4px 9px;font-size:10.5px;
  background:rgba(43,43,74,.92);letter-spacing:.3px;}
.cut.closing .tx{background:#F6F3FF;}

/* 말풍선 — 그림 위에 얹는다(이미지 모델은 글자를 못 그린다) */
.bub{position:absolute;z-index:2;max-width:74%;padding:8px 11px;font-size:12.5px;line-height:1.38;
  background:rgba(255,255,255,.96);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.14);}
.bub .be{font-weight:700;}
.bub .bk{font-size:11px;color:var(--kr);margin-top:3px;}
.bub.tl{top:9px;left:40px;} .bub.tr{top:9px;right:9px;}
.bub.bl{bottom:9px;left:9px;} .bub.br{bottom:9px;right:9px;}
.bub.thought{border:1.5px dashed #B9A9E4;border-radius:18px;}
.bub.narration{background:rgba(36,30,63,.92);color:#fff;border-radius:7px;}
.bub.narration .bk{color:rgba(255,255,255,.75);}
.bub.speech:after{content:"";position:absolute;bottom:-7px;left:18px;border:7px solid transparent;
  border-top-color:rgba(255,255,255,.96);border-bottom:0;}

.tx{padding:13px 14px 14px;}
.en{font-weight:700;font-size:15px;line-height:1.5;letter-spacing:-.1px;}
.en mark{background:#FFF0A8;color:inherit;border-radius:3px;padding:0 1px;}
.ko{margin-top:9px;font-size:13px;line-height:1.62;color:var(--kr);word-break:keep-all;
  border-top:1px solid var(--line);padding-top:9px;}
.tap{margin-top:9px;font-size:11.5px;color:var(--purple);font-weight:700;
  background:var(--soft);border-radius:8px;padding:7px;text-align:center;width:100%;}

.done-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
  text-align:center;box-shadow:var(--shadow);}
.done-box b{display:block;font-size:14px;margin-bottom:10px;}
.btn{display:inline-block;background:var(--purple);color:#fff;border-radius:11px;
  padding:11px 18px;font-size:13.5px;font-weight:700;}

/* ── 원문 ── */
.plain{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
  box-shadow:var(--shadow);}
.plain .pe{font-size:14.5px;line-height:1.75;font-weight:600;}
.plain .pk{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  font-size:13px;line-height:1.75;color:var(--kr);word-break:keep-all;}

/* ── 리뷰 ── */
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;
  box-shadow:var(--shadow);margin-bottom:8px;}
.box .be{font-size:14.5px;font-weight:700;line-height:1.5;}
.box .bk{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:13px;line-height:1.65;color:var(--kr);word-break:keep-all;}
.h{font-size:13px;font-weight:800;color:var(--purple);margin:16px 0 8px;letter-spacing:.2px;}
.h:first-child{margin-top:0;}
.voc{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.voc div{font-size:12.5px;line-height:1.5;padding:3px 0;border-bottom:1px dotted var(--line);}
.voc b{font-weight:700;} .voc s{text-decoration:none;color:var(--kr);}
.flow{display:flex;flex-direction:column;gap:7px;}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;
  display:flex;gap:11px;align-items:flex-start;box-shadow:var(--shadow);}
.step .n{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--purple);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.step .lb{font-size:9.5px;font-weight:800;letter-spacing:1.3px;color:#8A7EBB;}
.step .kk{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.4;word-break:keep-all;}
.step .ee{font-size:11.5px;color:#8A7EBB;font-weight:600;margin-top:3px;line-height:1.35;}

/* ── 하단 탭 ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:#9A90C0;}
.tabs button.on{color:var(--purple);}
.tabs svg{width:21px;height:21px;}

.foot{text-align:center;font-size:10.5px;color:#9A90C0;padding:18px 0 4px;line-height:1.7;}
.foot b{color:var(--kr);}

/* ── 저장 도구(학생 배포본에는 안 들어감) ── */
#save{position:fixed;right:10px;bottom:calc(var(--tabh) + 10px);z-index:50;
  background:rgba(36,30,63,.88);color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;
  font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25);}
#save[hidden]{display:none!important;}
</style>

<script>window.RT_DATA={"meta":{"title":"리딩툰 26년9월고1 24번","subtitle":"26년9월고1 24번","supra":"영어 독해","exam":"","scope":"지문 1개","tag":"26년9월고1 24번","per_day":4,"brandName":"더클영어","brandLine":"010-9922-7022 · thecleedu.com"},"passages":[{"no":"24","title":"Plans in Pencil","kindLabel":"제목","cuts":[{"n":"01","en":"Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty.","kr":"우리의 통제 욕구를 내려놓는 것, 즉 깨어있음(자각)은 불확실성에 맞설 용기를 모으는 것과 많은 부분 관련이 있다.","img":"images/24_p1.png","crop":"q0","bubble":{"en":"I need courage for uncertainty.","kr":"불확실성에는 용기가 필요해.","words":["courage","uncertainty"],"pos":"tr","kind":"thought"},"kind":null,"label":null},{"n":"02","en":"Human beings want to know. When we don't know, when things are uncertain, we often feel frightened and become inflexible.","kr":"인간은 알고 싶어 한다. 우리가 모를 때, 상황이 불확실할 때, 우리는 종종 두려움을 느끼고 융통성이 없어진다.","img":"images/24_p1.png","crop":"q1","bubble":{"en":"I feel frightened when I don't know.","kr":"모르면 나는 무서워.","words":["frightened","inflexible"],"pos":"bl","kind":"speech"},"kind":null,"label":null},{"n":"03","en":"So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time.","kr":"그래서 우리는 실제로 항상 엄청난 불확실성 속에 살고 있음에도 불구하고, 상황이 실제보다 더 예측 가능한 척한다.","img":"images/24_p1.png","crop":"q2","bubble":{"en":"I want life to feel predictable.","kr":"삶이 예측 가능했으면 해.","words":["predictable","uncertainty"],"pos":"tl","kind":"thought"},"kind":null,"label":null},{"n":"04","en":"We cling to our plans and ideas about how things should be and turn out ever so desperately.","kr":"우리는 일이 어떻게 되어야 한다는 우리의 계획과 생각에 매달리며, 그것이 몹시도 절박하게 이루어지기를 바란다.","img":"images/24_p1.png","crop":"q3","bubble":{"en":"I cling to my plans.","kr":"나는 계획에 매달려.","words":["cling","desperately"],"pos":"br","kind":"speech"},"kind":null,"label":null},{"n":"05","en":"And there's nothing wrong with having plans. I think it's a beautiful thing. But there's a difference between planning and thinking all your plans have to come to fruition.","kr":"그리고 계획을 세우는 것 자체에는 잘못된 것이 전혀 없다. 나는 그것이 아름다운 일이라고 생각한다. 하지만 계획을 세우는 것과 자신의 모든 계획이 반드시 결실을 맺어야 한다고 생각하는 것 사이에는 차이가 있다.","img":"images/24_p2.png","crop":"q0","bubble":{"en":"Planning is beautiful, but stay flexible.","kr":"계획은 좋지만 유연해야 해.","words":["planning","fruition"],"pos":"tl","kind":"speech"},"kind":null,"label":null},{"n":"06","en":"American president Eisenhower once said: 'Plans are worthless, but planning is everything.'","kr":"미국 대통령 아이젠하워는 언젠가 이렇게 말했다: '계획 그 자체는 아무 가치가 없지만, 계획을 세우는 과정은 모든 것이다.'","img":"images/24_p2.png","crop":"q1","bubble":{"en":"Planning matters more than plans.","kr":"계획보다 계획 과정이 중요해.","words":["Plans","planning"],"pos":"br","kind":"speech"},"kind":null,"label":null},{"n":"07","en":"Imagine if we all used pencil instead of ink to write in our calendars and planners. Both figuratively and literally.","kr":"우리가 달력과 다이어리에 잉크 대신 모두 연필을 사용한다고 상상해 보라. 비유적으로도, 문자 그대로도 둘 다 그렇다.","img":"images/24_p2.png","crop":"q2","bubble":{"en":"I'll use pencil instead of ink.","kr":"잉크 대신 연필을 쓸래.","words":["pencil","ink"],"pos":"tr","kind":"speech"},"kind":null,"label":null},{"n":"08","en":"Imagine if we could bear in mind that what we write down, what we think is going to happen, might not be what actually happens. And if we could try our best to be all right with that.","kr":"우리가 적어 놓은 것, 우리가 일어날 것이라고 생각하는 것이 실제로 일어나는 일이 아닐 수도 있다는 것을 마음에 새길 수 있다면 어떨까. 그리고 그것에 대해 우리가 최선을 다해 괜찮아할 수 있다면.","img":"images/24_p2.png","crop":"q3","bubble":{"en":"What happens might surprise me.","kr":"일은 나를 놀라게 할 수도 있어.","words":["actually","all right"],"pos":"bl","kind":"thought"},"kind":null,"label":null}],"review":{"topic":{"en":"The value of flexible planning in an uncertain life","kr":"불확실한 삶에서 유연하게 계획하는 태도"},"summary":{"en":"People seek certainty, and the unknown can make them fearful and rigid. This often makes them hold too tightly to expected outcomes. Planning itself is worthwhile, but no plan should be treated as guaranteed. We can prepare carefully while accepting changes with calmness.","kr":"사람들은 확실함을 원하며, 모르는 상황에서는 두려워하고 경직되기 쉽다. 그래서 기대한 결과에 지나치게 매달리기도 한다. 계획을 세우는 일은 가치 있지만, 모든 계획이 반드시 실현된다고 여겨서는 안 된다. 우리는 잘 준비하면서도 변화를 차분히 받아들일 수 있다."},"flow":[{"label":"PREMISE","kr":"불확실성을 마주할 용기","en":"Courage faces uncertainty"},{"label":"PROBLEM","kr":"두려움이 경직된 태도를 만듦","en":"Fear creates rigidity"},{"label":"CONTRAST","kr":"계획과 결과 집착은 다름","en":"Planning differs from attachment"},{"label":"CORE GOAL","kr":"변화를 받아들이며 계획하기","en":"Plan while accepting change"}]},"vocab":[{"w":"fruition","pos":"명","kr":"실현","rank":1,"b":true},{"w":"uncertainty","pos":"명","kr":"불확실성","rank":2,"b":true},{"w":"inflexible","pos":"형","kr":"융통성 없는","rank":2,"b":true},{"w":"predictable","pos":"형","kr":"예측 가능한","rank":2,"b":true},{"w":"cling","pos":"동","kr":"집착하다","rank":2,"b":true},{"w":"desperately","pos":"부","kr":"필사적으로","rank":2,"b":true},{"w":"enormous","pos":"형","kr":"엄청난","rank":2},{"w":"worthless","pos":"형","kr":"가치 없는","rank":2},{"w":"figuratively","pos":"부","kr":"비유적으로","rank":2},{"w":"pretend","pos":"동","kr":"~인 척하다","rank":2},{"w":"bear in mind","pos":"구","kr":"명심하다","rank":2},{"w":"courage","pos":"명","kr":"용기","rank":3,"b":true},{"w":"frightened","pos":"형","kr":"겁먹은","rank":3,"b":true},{"w":"planning","pos":"명","kr":"계획 수립","rank":3,"b":true},{"w":"ink","pos":"명","kr":"잉크","rank":3,"b":true},{"w":"literally","pos":"부","kr":"문자 그대로","rank":3},{"w":"turn out","pos":"구","kr":"결국 되다","rank":3},{"w":"Plans","pos":"명","kr":"계획들","rank":4,"b":true},{"w":"pencil","pos":"명","kr":"연필","rank":4,"b":true},{"w":"actually","pos":"부","kr":"실제로","rank":4,"b":true},{"w":"all right","pos":"구","kr":"괜찮은","rank":4,"b":true},{"w":"aware","pos":"형","kr":"알아차리는","rank":4},{"w":"letting go","pos":"구","kr":"놓아주기","rank":4},{"w":"calendars","pos":"명","kr":"달력들","rank":4}]}]};</script>
<script>
(function(){
var D = window.RT_DATA, M = D.meta, P = D.passages;
var SRC = window.RT_SRC;                       // 그림 경로 → 실제 주소(저장 시 data:URI 로 바뀐다)
var PER = M.per_day || 4;
var KEY = 'rt:' + (M.tag || M.title || 'x');

var st = { tab:'today', day:1, cur:P[0] && P[0].no, open:{}, seen:{} };
try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); st.day = s.day||1; st.cur = s.cur||st.cur; st.seen = s.seen||{}; } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({day:st.day,cur:st.cur,seen:st.seen})); } catch(e){} }

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function pass(no){ for (var i=0;i<P.length;i++) if (P[i].no===no) return P[i]; return P[0]; }
function idxOf(no){ for (var i=0;i<P.length;i++) if (P[i].no===no) return i; return 0; }
function dayOf(i){ return Math.floor(i/PER)+1; }
var DAYS = Math.ceil(P.length/PER) || 1;

// 그림 한 칸 — 자르지 않고 배경 위치만 옮긴다
function art(c, cls){
  if (!c.img) return '<div class="qimg"></div>';
  var crop = c.crop || 'full';
  return '<div class="qimg '+crop+(cls?' '+cls:'')+'" data-src="'+esc(c.img)+'"></div>';
}
function paintArt(root){
  var els = (root||document).querySelectorAll('.qimg[data-src]');
  for (var i=0;i<els.length;i++){
    var k = els[i].getAttribute('data-src');
    if (SRC[k]) els[i].style.backgroundImage = 'url("'+SRC[k]+'")';
  }
}

// 말풍선이 빌려 온 낱말을 원문에서 형광 표시
function mark(en, words){
  if (!words || !words.length) return esc(en);
  var out = esc(en);
  for (var i=0;i<words.length;i++){
    var w = String(words[i]||'').trim(); if (w.length<3) continue;
    var stem = w.replace(/(ing|ed|es|s|ly|ment|tion)$/i,'');
    if (stem.length<3) stem = w;
    var re = new RegExp('(?![^<]*>)\\b('+stem.replace(/[.*+?^\${}()|[\]\\]/g,'\\$&')+'[a-z]*)\\b','i');
    out = out.replace(re, '<mark>$1</mark>');
  }
  return out;
}

/* ─────────── 오늘 ─────────── */
function vToday(){
  var seen = 0; for (var k in st.seen) if (st.seen[k]) seen++;
  var pct = Math.round(seen/P.length*100);
  var h = '<div class="hero"><h1>'+esc(M.subtitle||M.title)+'</h1>'
    + '<p>'+esc(M.exam||M.supra||'')+'<br>'+esc(M.scope||'')+' · 하루 '+PER+'지문</p>'
    + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
    + '<div class="bar-n">'+seen+' / '+P.length+'지문 읽음</div></div>';

  h += '<div class="days">';
  for (var d=1; d<=DAYS; d++){
    var n = P.filter(function(_,i){ return dayOf(i)===d; }).length;
    h += '<button class="day'+(d===st.day?' on':'')+'" data-day="'+d+'"><b>D'+d+'</b><s>'+n+'지문</s></button>';
  }
  h += '</div>';

  h += '<div class="sec-t">DAY '+st.day+' · 오늘의 지문</div>';
  P.forEach(function(p,i){
    if (dayOf(i)!==st.day) return;
    var done = !!st.seen[p.no];
    h += '<button class="card'+(done?' done':'')+'" data-open="'+esc(p.no)+'">'
      +   '<div class="thumb">'+art(p.cuts[0])+'</div>'
      +   '<div style="flex:1;min-width:0">'
      +     '<div class="no">'+esc(p.no)+'번</div>'
      +     '<div class="tt">'+esc(p.title)+'</div>'
      +     '<div class="mt">'+(p.kindLabel?'<span class="chip">'+esc(p.kindLabel)+'</span>':'')+p.cuts.length+'컷</div>'
      +   '</div>'
      +   (done?'<div class="tick">✓</div>':'')
      + '</button>';
  });
  return h;
}

/* ─────────── 웹툰 ─────────── */
function vToon(){
  var p = pass(st.cur), h = '';
  p.cuts.forEach(function(c,i){
    var shown = !!st.open[i];
    var b = c.bubble;
    var cl = c.kind === 'closing';
    h += '<div class="cut'+(cl?' closing':'')+'" data-i="'+i+'"><div class="art">'
       + '<div class="cutno'+(cl?' tag':'')+'">'+esc(cl ? (c.label||'마무리') : c.n)+'</div>'+art(c);
    if (b && b.en) {
      h += '<div class="bub '+esc(b.kind||'speech')+' '+esc(b.pos||'tr')+'">'
         +   '<div class="be">'+esc(b.en)+'</div><div class="bk">'+esc(b.kr)+'</div></div>';
    }
    h += '</div><div class="tx"><div class="en">'+mark(c.en, b&&b.words)+'</div>';
    if (shown) h += '<div class="ko">'+esc(c.kr)+'</div>';
    else h += '<button class="tap" data-cut="'+i+'">해석 보기</button>';
    h += '</div></div>';
  });
  var nx = P[idxOf(st.cur)+1];
  h += '<div class="done-box"><b>'+esc(p.no)+'번 · '+esc(p.title)+' 끝</b>'
    +  '<button class="btn" data-next="'+(nx?esc(nx.no):'')+'">'
    +  (nx ? nx.no+'번으로 →' : '오늘의 학습으로 →')+'</button></div>';
  return h;
}

/* ─────────── 원문 ─────────── */
function vText(){
  var p = pass(st.cur);
  // 마무리 컷은 요약이라 원문이 아니다. 원문 탭에는 절대 섞지 않는다.
  var body = p.cuts.filter(function(c){ return c.kind !== 'closing'; });
  return '<div class="plain"><div class="pe">'+esc(body.map(function(c){return c.en;}).join(' '))+'</div>'
    + '<div class="pk">'+esc(body.map(function(c){return c.kr;}).join(' '))+'</div></div>';
}

/* ─────────── 리뷰 ─────────── */
function vReview(){
  var p = pass(st.cur), r = p.review || {}, h = '';
  if (r.topic) h += '<div class="h">1. Topic</div><div class="box"><div class="be">'+esc(r.topic.en)
    + '</div><div class="bk">'+esc(r.topic.kr)+'</div></div>';
  var v = (p.vocab||[]).filter(function(x){return x.kr;});
  if (v.length) {
    h += '<div class="h">KEY WORDS</div><div class="box"><div class="voc">';
    v.forEach(function(x){ h += '<div><b>'+esc(x.w)+'</b> <s>'+esc(x.pos||'')+' '+esc(x.kr)+'</s></div>'; });
    h += '</div></div>';
  }
  if (r.summary) h += '<div class="h">2. Summary</div><div class="box"><div class="be">'+esc(r.summary.en)
    + '</div><div class="bk">'+esc(r.summary.kr)+'</div></div>';
  if (r.flow && r.flow.length) {
    h += '<div class="h">3. Flow</div><div class="flow">';
    r.flow.forEach(function(f,i){
      h += '<div class="step"><div class="n">'+(i+1)+'</div><div style="flex:1;min-width:0">'
        +  '<div class="lb">'+esc(f.label)+'</div><div class="kk">'+esc(f.kr)+'</div>'
        +  '<div class="ee">'+esc(f.en)+'</div></div></div>';
    });
    h += '</div>';
  }
  return h;
}

/** 머리글의 "n / m컷" 과 전체 단추만 고친다 (다시 그리지 않으려고) */
function headCount(n, m){
  var sub = document.querySelector('#top .sub');
  if (sub) sub.textContent = n + ' / ' + m + '컷';
  var all = document.getElementById('all');
  if (all) all.textContent = (n === m) ? '해석 접기' : '해석 전체';
}

/* ─────────── 그리기 ─────────── */
function render(keepScroll){
  var p = pass(st.cur), top = document.getElementById('top'), body = document.getElementById('body');
  // 보던 컷을 붙잡는다. 해석이 펼쳐지면 위쪽 컷도 길어지므로 픽셀만으로는 화면이 밀린다.
  var anchor = null;
  if (keepScroll) {
    var cs = document.querySelectorAll('.cut[data-i]');
    for (var a=0;a<cs.length;a++) {
      var r = cs[a].getBoundingClientRect();
      if (r.bottom > 0) { anchor = { i: cs[a].dataset.i, top: r.top }; break; }
    }
  }
  var keepY = keepScroll ? (window.scrollY || 0) : 0;
  var t = st.tab, h = '';
  if (t==='today') {
    top.innerHTML = '<div class="ttl">READING TOON<div class="sub">'+esc(M.subtitle||'')+'</div></div>';
    h = vToday();
  } else {
    var shown = 0; for (var i=0;i<p.cuts.length;i++) if (st.open[i]) shown++;
    var all = shown===p.cuts.length;
    top.innerHTML = '<button class="back" id="back">‹</button>'
      + '<div class="ttl">'+esc(p.no)+' '+esc(p.title)+'<div class="sub">'
      + (t==='toon' ? shown+' / '+p.cuts.length+'컷' : (p.kindLabel||''))+'</div></div>'
      + (t==='toon' ? '<button class="act" id="all">'+(all?'해석 접기':'해석 전체')+'</button>' : '');
    h = t==='toon' ? vToon() : t==='text' ? vText() : vReview();
  }
  h += '<div class="foot"><b>'+esc(M.brandName||'')+'</b>'
     + (M.brandLine ? '<br>'+esc(M.brandLine) : '')+'</div>';
  body.innerHTML = h;
  paintArt(body);
  var tabs = document.querySelectorAll('.tabs button');
  for (var j=0;j<tabs.length;j++) tabs[j].classList.toggle('on', tabs[j].dataset.tab===st.tab);
  var sv = document.getElementById('save'); if (sv) sv.hidden = (st.tab !== 'today');
  if (anchor) {
    var el2 = body.querySelector('.cut[data-i="' + anchor.i + '"]');
    if (el2) {
      window.scrollTo(0, (window.scrollY || 0) + el2.getBoundingClientRect().top - anchor.top);
      return;
    }
  }
  window.scrollTo(0, keepY);
}

/* ─────────── 조작 ─────────── */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-day],[data-open],[data-cut],[data-next],[data-tab],#back,#all');
  if (!el) return;
  if (el.dataset.day)  { st.day = +el.dataset.day; save(); return render(); }
  if (el.dataset.open !== undefined && el.hasAttribute('data-open')) {
    st.cur = el.dataset.open; st.open = {}; st.tab = 'toon'; save(); return render();
  }
  if (el.dataset.cut !== undefined && el.hasAttribute('data-cut')) {
    // 화면을 다시 그리면 스크롤이 맨 위로 튄다. 누른 자리만 바꿔 끼운다.
    var ci = +el.dataset.cut, p = pass(st.cur);
    st.open[ci] = true;
    var ko = document.createElement('div');
    ko.className = 'ko';
    ko.textContent = p.cuts[ci].kr || '';
    if (el.parentNode) el.parentNode.replaceChild(ko, el);
    var n = 0; for (var i=0;i<p.cuts.length;i++) if (st.open[i]) n++;
    if (n === p.cuts.length) st.seen[st.cur] = true;
    save();
    headCount(n, p.cuts.length);
    return;
  }
  if (el.hasAttribute('data-next')) {
    st.seen[st.cur] = true;
    if (el.dataset.next) { st.cur = el.dataset.next; st.open = {}; st.tab='toon'; }
    else st.tab = 'today';
    save(); return render();   // 새 지문이므로 맨 위에서
  }
  if (el.dataset.tab) { st.tab = el.dataset.tab; return render(); }
  if (el.id === 'back') { st.tab = 'today'; return render(); }
  if (el.id === 'all') {
    var q = pass(st.cur), c = 0; for (var k=0;k<q.cuts.length;k++) if (st.open[k]) c++;
    if (c === q.cuts.length) st.open = {};
    else { st.open = {}; for (var m=0;m<q.cuts.length;m++) st.open[m] = true; st.seen[st.cur]=true; }
    save(); return render(true);   // 보던 자리 그대로
  }
});

render();
window.RT_RENDER = render;
})();
</script>
